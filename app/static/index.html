
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101014">

  <title>CART3R.JAILBREAK | CHESS BEST MOVE</title>

  <link rel="stylesheet" href="/static/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>

<body>
  <header>
    <h1>CART3R.JAILBREAK</h1>
    <p>CHESS BEST MOVE</p>
  </header>

  <main>
    <section class="game-panel">

      <div class="panel-heading">
        <h2>SPIELBRETT</h2>
        <span class="live-status">ONLINE</span>
      </div>

      <div id="turn">WEISS AM ZUG</div>

      <div id="board" aria-label="Interaktives Schachbrett"></div>

      <div class="board-controls">
        <button id="flip">BRETT DREHEN</button>
        <button id="undo">ZUG ZURÜCK</button>
        <button id="reset">NEUES SPIEL</button>
      </div>

    </section>

    <section class="analysis-panel">
      <h2>STOCKFISH ANALYSE</h2>

      <button id="analyze" class="main-button">
        BESTEN ZUG FINDEN
      </button>

      <button id="play-best" class="play-button" disabled>
        BESTEN ZUG SPIELEN
      </button>

      <div id="result">
        <strong>BEREIT</strong>
        <p>Spiele einen Zug und starte anschließend die Analyse.</p>
      </div>

      <h3>ZUGVERLAUF</h3>
      <div id="history">Noch keine Züge.</div>
    </section>
  </main>

  <footer>
    CART3R.JAILBREAK CHESS ENGINE
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
