
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CART3R.JAILBREAK – Chess Best Move</title>

  <link rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <h1>CART3R.JAILBREAK</h1>
    <p>CHESS BEST MOVE</p>
  </header>

  <main>
    <section class="game">
      <h2>Schachbrett</h2>

      <div id="board"></div>

      <p id="turn">Weiß ist am Zug</p>

      <div class="controls">
        <button id="flip">Brett drehen</button>
        <button id="undo">Zug zurück</button>
        <button id="reset">Neues Spiel</button>
      </div>
    </section>

    <section class="analysis">
      <h2>KI-Analyse</h2>

      <button id="analyze">BESTEN ZUG FINDEN</button>
      <button id="play-best" disabled>BESTEN ZUG SPIELEN</button>

      <div id="result">
        Noch keine Analyse durchgeführt.
      </div>

      <h3>Zugverlauf</h3>
      <div id="history">Noch keine Züge.</div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/chess.js@0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="/static/app.js"></script>

</body>
</html>
