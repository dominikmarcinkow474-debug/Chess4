
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CHESS BEST MOVE</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<main class="container">

    <header>
        <h1>♟ CHESS <span>BEST MOVE</span></h1>
        <p>Play chess. Analyze positions. Find the best move.</p>
    </header>

    <section class="game">

        <div class="board-container">
            <div class="board-header">
                <span id="turn-label">Weiß am Zug</span>
                <button id="flip">Brett drehen</button>
            </div>

            <div id="board"></div>

            <div class="controls">
                <button id="undo">Zug zurück</button>
                <button id="reset">Neue Partie</button>
            </div>
        </div>

        <aside class="panel">

            <h2>STOCKFISH ANALYSE</h2>

            <button id="analyze" class="primary">
                ✦ BESTEN ZUG ANZEIGEN
            </button>

            <button id="play-best" disabled>
                BESTEN ZUG ÜBERNEHMEN
            </button>

            <div id="result" class="result">
                Warte auf Analyse...
            </div>

            <h2>PARTIEVERLAUF</h2>

            <ol id="history"></ol>

            <h2>PGN ZUG-EINGABE</h2>

            <textarea id="pgn"
                placeholder="1. e4 e5 2. Nf3 Nc6">
            </textarea>

            <button id="load-pgn">
                ZÜGE LADEN
            </button>

        </aside>
    </section>

</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script src="/static/app.js"></script>

</body>
</html>
