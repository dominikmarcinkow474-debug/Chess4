
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#101014">

  <title>Chess Best Move</title>

  <link rel="stylesheet" href="/static/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>

<body>

  <header>
    <h1>CHESS BEST MOVE</h1>
  </header>

  <main>
    <section class="game-panel">

      <h2>SPIELBRETT</h2>

      <div id="turn">WEISS AM ZUG</div>

      <div id="board"></div>

      <div class="board-controls">
        <button id="flip">BRETT DREHEN</button>
        <button id="undo">ZUG ZURÜCK</button>
        <button id="reset">NEUES SPIEL</button>
      </div>

    </section>

    <section class="analysis-panel">

      <h2>STOCKFISH ANALYSE</h2>

      <button id="analyze" class="main-button">
        BESTEN ZUG FINDEN
      </button>

      <button id="play-best" class="play-button" disabled>
        BESTEN ZUG SPIELEN
      </button>

      <div id="result" hidden></div>

      <h3>ZUGVERLAUF</h3>
      <div id="history">Noch keine Züge.</div>

    </section>
  </main>

  <!-- Werbeeinblendung -->
  <div id="ad-overlay" class="ad-overlay" hidden>
    <div class="ad-window">

      <span class="ad-label">WERBUNG</span>

      <h2>Anzeige</h2>

      <p id="ad-message">
        Hier kann deine Werbeanzeige erscheinen.
      </p>

      <button id="close-ad" class="main-button">
        WEITER ZUM SPIEL
      </button>

    </div>
  </div>

  <footer>
    CHESS BEST MOVE
  </footer>

  <script src="/static/app.js"></script>

</body>
</html>
